<!DOCTYPE html>
<html>

  <head>
         <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>

    <a-assets>
               
        <!-- TEXTURES -->
        <img id="texture1" src="assets/image/foret sombre.avif">
        <img id="texture2" src="assets/image/bois sombre.jpg">
        <img id="texture3" src="assets/image/vieux papier paint.jpg">
        <img id="texture4" src="assets/image/moquette.jpg">
                
        <!-- TEXTURES PRINCIPALES -->
        <a-asset-item 
               id="texture2" 
               material="src: #texture2; shader: standard"
        ></a-asset-item>

        <a-asset-item 
               id="texture3" 
               material="src: #texture3; shader: standard"
        ></a-asset-item>

    </a-assets>


    <a-scene>

        <!-- SOL -->
        <a-plane 
               position="-1 -0.850 -0.010" 
               rotation="-90 0 0" 
               height="4" 
               width= "4" 
               src= "#texture4"
        ></a-plane>

        <!-- CIEL -->
        <a-sky color="skyblue" src="#texture1" material="repeat: 3 1"></a-sky>
      
        <!-- LABYRINTHE -->
        <a-entity id="labyrinthe">

        <!-- MURS EXTERIEURS -->
        <a-box 
               material="src: #texture2; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1.76" 
               position="-2.2 1.2 -2"
        ></a-box>

        <a-box 
               material="src: #texture2; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1.6" 
               position="0.30 1.2 -2"
        ></a-box>

        <a-box 
               material="src: #texture2; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="3.2" 
               position="-3 1.2 -0.5"
               rotation="0 90 0"
        ></a-box>
        
        <a-box 
               material="src: #texture2; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="4" 
               position="-1 1.2 2"
               rotation="0 0 0"
        ></a-box>

        <a-box 
               material="src: #texture2; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="4" 
               position="1 1.2 0.1"
               rotation="0 90 0"
        ></a-box>

        <!-- MURS INTERIEURS -->
        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1.34" 
               position="-0.7 1.2 -1"
        ></a-box>

        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1.8" 
               position="-1.2 1.2 1"
               rotation="0 0 0"
        ></a-box>

        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1"
               position="-2 1.2 1.4"
               rotation="0 90 0"
        ></a-box>
          
        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1" 
               position="-1.41 1.2 -1.4"
               rotation="0 90 0"
        ></a-box>

        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1" 
               position="-1.4 1.2 0.5"
               rotation="0 90 0"
        ></a-box>
          
        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="1.1" 
               position="-0.13 1.2 -0.4"
               rotation="0 90 0"
        ></a-box>

        <a-box 
               material="src: #texture3; shader: standard; repeat: 1 1" 
               depth="0.18" 
               height="4" 
               width="0.8" 
               position="-1.7 1.2 -0.05"
               rotation="0 155 0"
        ></a-box>

        </a-entity>

        <!-- CAMERA -->
        <a-entity camera="active: true" 
        look-controls wasd-controls="acceleration:10" 
        position="0 1.6 0"
        light = "type: spot; intensité: 1.2; color: cleargrey; angle: 70; penumbra: 1; distance: 15"
        ></a-entity>

    </a-scene>

  </body>

</html>
