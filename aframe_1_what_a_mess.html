  <!-- GESTION DE LA DISPARITION DES OBJETS -->
  <script>
    function traiterDisparition(id) {
      const elem = document.querySelector(id);

      if (!elem || elem.dataset.disparition === 'faite') return;

      elem.dataset.disparition = 'faite';
      elem.removeAttribute('model-reboot');
      elem.removeAttribute('model-transparent');

      if (id.startsWith('#ecran')) {
        elem.setAttribute('material', 'transparent', true);

        elem.setAttribute('animation__disappear', {
          property: 'material.opacity',
          from: 1,
          to: 0,
          dur: 900,
          easing: 'linear'
        });

        const lumiere = elem.querySelector('a-light');

        if (lumiere) {
          lumiere.setAttribute('animation__off', {
            property: 'light.intensity',
            from: 1,
            to: 0,
            dur: 900,
            easing: 'linear'
          });
        }
      }

      setTimeout(function () {
        elem.setAttribute('visible', false);
      }, 900);

      setTimeout(function () {
        elem.setAttribute('visible', false);
        if (elem.parentNode) {
          elem.parentNode.removeChild(elem);
        }
      }, 2000);
    }

    const tousLesElements = [
      '#Bureau',
      '#meuble',
      '#ordi1',
      '#ordi2',
      '#ordi3',
      '#ecran1',
      '#ecran2',
      '#ecran3',
      '#ecran4'
    ];

    tousLesElements.forEach(function (id) {
      const elem = document.querySelector(id);

      if (elem) {
        elem.addEventListener('desappear', function () {
          traiterDisparition(id);
        });
      }
    });

    // RACCOURCIS CLAVIER
    document.addEventListener('keydown', function (event) {
      const key = event.key.toLowerCase();

      if (key === 'e') {
        traiterDisparition('#ecran3');
        traiterDisparition('#ordi3');
      }

      if (key === 'r') {
        traiterDisparition('#ecran1');
        traiterDisparition('#ordi1');
      }

      if (key === 't') {
        traiterDisparition('#ecran2');
        traiterDisparition('#ordi2');
      }

      if (key === 'y') {
        traiterDisparition('#ecran4');
        traiterDisparition('#Bureau');
      }
    });
  </script>

  <!-- GESTION DU SON -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const musique = document.querySelector('#musique');
      const boutonSon = document.querySelector('#bouton');

      if (!musique || !boutonSon) {
        console.error('Musique ou bouton audio introuvable.');
        return;
      }

      function lancerSon() {
        musique.play()
          .then(function () {
            boutonSon.textContent = 'SON OFF';
          })
          .catch(function (erreur) {
            console.error('Impossible de lancer le son :', erreur);
            boutonSon.textContent = 'RÉESSAYER';
          });
      }

      document.addEventListener('keydown', function (event) {
        if (event.key.toLowerCase() === 's' && !event.repeat) {
          lancerSon();
        }
      });

      boutonSon.addEventListener('click', function () {
        if (musique.paused) {
          lancerSon();
        } else {
          musique.pause();
          boutonSon.textContent = 'SON ON';
        }
      });

      musique.addEventListener('error', function () {
        console.error('Erreur de chargement du fichier audio. Vérifie le chemin assets/audio.');
      });
    });
